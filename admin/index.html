
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Admin | Course Archive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #24292f;
      margin: 0;
      padding: 40px 20px;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 32px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background: #0969da;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #8c959f;
      cursor: not-allowed;
    }
    .note {
      color: #57606a;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Course Archive Admin</h1>
    <p class="note">Administrator upload panel</p>

    <form>
      <label for="course">Course Code</label>
      <input id="course" placeholder="e.g. APBI 314"
             required>

      <label for="title">Document Title</label>
      <input id="title" placeholder="e.g. Assignment 5"
             required>

      <label for="file">Select PDF</label>
      <input id="file" type="file"
             accept=".pdf,application/pdf" required>

      <button type="button" disabled>
        Upload (Coming Soon)
      </button>
    </form>

    <p class="note">
      Upload functionality will be enabled after
      administrator authentication is configured.
    </p>
  </main>
</body>
</html>
